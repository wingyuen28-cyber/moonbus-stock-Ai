<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HK Stock AI - 港股全網異動與 AI 診斷</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      padding: 16px;
      padding-bottom: 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 11px;
      background: #238636;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-box input {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .search-box input:focus {
      border-color: #58a6ff;
    }
    .search-box button {
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stock-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .stock-name {
      font-size: 22px;
      font-weight: bold;
      color: white;
    }
    .stock-code {
      font-size: 14px;
      color: #8b949e;
      margin-top: 2px;
    }
    .category-tag {
      font-size: 12px;
      background: #1f6feb22;
      color: #58a6ff;
      border: 1px solid #1f6feb;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .ai-score {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #21262d;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .score-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #238636;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: white;
    }
    .score-info {
      flex: 1;
    }
    .score-title {
      font-size: 13px;
      color: #8b949e;
    }
    .score-desc {
      font-size: 14px;
      font-weight: bold;
      color: #3fb950;
      margin-top: 2px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .detail-item {
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
    }
    .detail-label {
      font-size: 12px;
      color: #8b949e;
    }
    .detail-value {
      font-size: 15px;
      font-weight: bold;
      margin-top: 4px;
    }
    .up { color: #f85149; } /* 港股傳統：紅升綠跌 或 可自訂 */
    .down { color: #3fb950; }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #e6edf3;
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .anomaly-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #21262d;
    }
    .anomaly-item:last-child {
      border-bottom: none;
    }
    .anomaly-tag {
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .tag-buy { background: #f8514922; color: #f85149; border: 1px solid #f85149; }
    .tag-sell { background: #3fb95022; color: #3fb950; border: 1px solid #3fb950; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📊 HK Stock AI</h1>
    <span class="status-badge" id="dbStatus">資料庫載入中...</span>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="輸入股票代號 (例如 700, 9988)..." value="700">
    <button onclick="handleSearch()">搜尋</button>
  </div>

  <!-- 搜尋結果/個股診斷卡 -->
  <div class="card" id="stockCard">
    <div class="stock-title">
      <div>
        <div class="stock-name" id="dispName">騰訊控股</div>
        <div class="stock-code" id="dispCode">HK.00700</div>
      </div>
      <span class="category-tag" id="dispCategory">港股主板</span>
    </div>

    <div class="ai-score">
      <div class="score-circle" id="dispScore">88</div>
      <div class="score-info">
        <div class="score-title">AI 綜合籌碼診斷</div>
        <div class="score-desc" id="dispDiagnosis">主力持續暗中吸籌，多頭結構穩固</div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">VWAP 成本線</div>
        <div class="detail-value" id="dispVwap">$382.40</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">5分鐘量比</div>
        <div class="detail-value up" id="dispVolRatio">3.45x (異動)</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">主動買盤佔比</div>
        <div class="detail-value up" id="dispBuyRatio">64.2%</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">資金流向狀態</div>
        <div class="detail-value up" id="dispFlow">淨流入 +2.4億</div>
      </div>
    </div>
  </div>

  <!-- 即時異動掃描列表 -->
  <div class="section-title">⚡ 全網最新異動發動 (模擬/即時)</div>
  <div class="card" id="anomalyList">
    <div class="anomaly-item">
      <div>
        <strong style="font-size:15px;">美團-W (03690)</strong>
        <div style="font-size:12px; color:#8b949e; margin-top:2px;">觸發：5分鐘成交額突破 1.2 億</div>
      </div>
      <span class="anomaly-tag tag-buy">主力發動 ▲</span>
    </div>
    <div class="anomaly-item">
      <div>
        <strong style="font-size:15px;">阿里巴巴-SW (09999)</strong>
        <div style="font-size:12px; color:#8b949e; margin-top:2px;">觸發：主動賣盤佔比過半</div>
      </div>
      <span class="anomaly-tag tag-sell">資金出貨 ▼</span>
    </div>
  </div>

  <script>
    let stockDatabase = {};

    // 1. 自動補零函數：將輸入的數字自動補滿至 5 位數標準港股代號
    function normalizeStockCode(code) {
      if (!code) return '';
      let cleanCode = code.toString().trim().replace(/\D/g, '');
      if (cleanCode.length === 0) return '';
      return cleanCode.padStart(5, '0');
    }

    // 2. 啟動時自動讀取港交所全量股票 JSON
    async function initStockDatabase() {
      const statusBadge = document.getElementById('dbStatus');
      try {
        const res = await fetch('stocks.json');
        if (res.ok) {
          stockDatabase = await res.json();
          const count = Object.keys(stockDatabase).length;
          statusBadge.innerText = `已載入 ${count} 隻港股`;
          statusBadge.style.background = "#238636";
        } else {
          statusBadge.innerText = "使用核心字典";
          statusBadge.style.background = "#9e6a03";
        }
      } catch (e) {
        statusBadge.innerText = "網絡即時查詢模式";
        statusBadge.style.background = "#1f6feb";
      }
      // 預設載入 00700
      handleSearch();
    }

    // 3. 查詢股票資訊（優先全量 JSON，備用騰訊財經 API）
    async function queryStockInfo(rawCode) {
      const code = normalizeStockCode(rawCode);
      if (!code) return null;

      // 本地全量字典查詢
      if (stockDatabase[code]) {
        return {
          code: code,
          name: stockDatabase[code].name,
          category: stockDatabase[code].category
        };
      }

      // 線上 API 備援查詢
      try {
        const res = await fetch(`https://qt.gtimg.cn/q=r_hk${code}`);
        const text = await res.text();
        if (text && text.includes('~')) {
          const parts = text.split('~');
          if (parts.length > 1 && parts[1]) {
            return {
              code: code,
              name: parts[1],
              category: '港股證券'
            };
          }
        }
      } catch (e) {
        console.warn("API 查詢失敗", e);
      }

      return {
        code: code,
        name: `港股 (${code})`,
        category: '未知板塊'
      };
    }

    // 4. 搜尋按鈕觸發事件
    async function handleSearch() {
      const input = document.getElementById('searchInput').value;
      const info = await queryStockInfo(input);

      if (info) {
        document.getElementById('dispName').innerText = info.name;
        document.getElementById('dispCode').innerText = `HK.${info.code}`;
        document.getElementById('dispCategory').innerText = info.category;

        // 生成隨機但合理的模擬 AI 診斷數據
        const mockScore = Math.floor(Math.random() * 30) + 70;
        document.getElementById('dispScore').innerText = mockScore;
        document.getElementById('dispVwap').innerText = `$${(Math.random() * 200 + 20).toFixed(2)}`;
        document.getElementById('dispVolRatio').innerText = `${(Math.random() * 3 + 1).toFixed(2)}x`;
        document.getElementById('dispBuyRatio').innerText = `${(Math.random() * 30 + 50).toFixed(1)}%`;
      }
    }

    // 頁面載入後自動啟動
    window.addEventListener('DOMContentLoaded', initStockDatabase);
  </script>
</body>
</html>
