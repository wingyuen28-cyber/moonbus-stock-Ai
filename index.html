<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoonBus 股票精選 AI</title>
<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json?v=45">
<meta name="theme-color" content="#FACC15">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0D1117;color:#E6EDF3}.card-bg{background:#161B22}.gold{color:#FACC15}.gold-light{color:#FDE68A}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}#splash{position:fixed;inset:0;background:#0D1117;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}</style>
</head>
<body class="pb-20">
<div id="splash"><img src="icon-512.png" style="width:88px;height:88px;border-radius:16px"><div style="color:#facc15;font-weight:900;margin-top:12px">MOONBUS V4.5 GOLD</div><div style="color:#666;font-size:10px;margin-top:6px">載入中...</div></div>
<script>
// 強制1.5秒後一定熄splash，唔理API死唔死
setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';s.style.transition='0.3s';setTimeout(function(){s.style.display='none';},300);}},1500);
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
</script>
<header class="sticky top-0 z-40 bg-[#0D1117]/95 backdrop-blur px-4 py-3 border-b border-zinc-800"><div class="flex justify-between items-center max-w-md mx-auto"><h1 class="font-black flex items-center gap-2 text-[13px]"><img src="icon-512.png" class="w-7 h-7 rounded-lg"><span class="gold">MOONBUS 股票精選 AI</span><span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-black">V4.5</span></h1><div class="text-[10px] text-emerald-400">● 即時</div></div></header>
<main class="max-w-md mx-auto px-4 mt-3 space-y-4">
<section class="space-y-2"><div class="flex justify-between items-center"><span class="text-[15px] font-black gold">⭐ 自選監測 <span id="watchlist-count" class="text-indigo-300 font-mono ml-1">--</span></span><span class="flex gap-2 items-center"><span id="last-update" class="text-[10px] text-zinc-500">--:--:--</span><button onclick="localStorage.setItem('mb_watch_v33',JSON.stringify(DEFAULT_WATCH));location.reload();" class="text-[10px] bg-yellow-400 text-black px-2.5 py-1 rounded-full font-black">重設8隻</button></span></div><div class="card-bg p-2.5 rounded-xl flex gap-2 border border-zinc-800"><input id="add-input" inputmode="numeric" placeholder="輸入代號 如 02342" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none"><button onclick="addWatch()" class="bg-[#FACC15] text-black font-black px-5 rounded-lg text-sm">加入</button></div><div id="stock-list" class="space-y-3"></div></section>
<section class="space-y-2"><div class="flex justify-between items-center"><span class="text-[14px] font-black gold">📊 異動掃描 <span id="hot-count" class="text-yellow-400 font-mono ml-1">--</span></span><div class="flex gap-1"><button onclick="filterHot('all')" id="f-all" class="text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold">全部</button><button onclick="filterHot('up')" id="f-up" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急升</button><button onclick="filterHot('down')" id="f-down" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急跌</button></div></div><div id="hot-list" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 text-xs text-zinc-500">載入中...</div></section>
<div class="flex bg-zinc-900 p-1 border border-zinc-800 rounded-lg"><button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2 text-sm rounded-md bg-white text-black font-bold">自選</button><button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2 text-sm rounded-md text-zinc-400">深度分析</button></div>
<section id="tab2-content" class="hidden"><div class="card-bg p-4 rounded-xl border border-zinc-800"><div class="flex justify-between"><div><h2 id="s-name" class="font-black text-base gold">---</h2><div id="s-code" class="text-xs text-zinc-500">HK.-----</div></div><div class="text-right"><div id="s-price" class="text-2xl font-black">$0.000</div><div id="s-change" class="text-xs font-bold">0.00%</div><div id="s-amount" class="text-[10px] text-zinc-400 mt-1">成交額 --</div></div></div><div class="h-36 mt-3"><canvas id="priceChart"></canvas></div></div></section>
</main>
<div id="replace-modal" class="fixed inset-0 bg-black/75 z-[100] hidden flex items-end justify-center"><div class="bg-[#161B22] w-full max-w-md rounded-t-2xl p-4 border-t border-zinc-700"><div class="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-3"></div><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm gold">自選已滿 10/10</h3><button onclick="closeReplace()" class="w-7 h-7 rounded-full bg-zinc-800">✕</button></div><div class="text-xs text-zinc-400 mb-2">新股 <span id="replace-new-code" class="text-yellow-400 font-bold"></span> 要替換邊一隻？</div><div id="replace-list" class="space-y-2 max-h-72 overflow-auto"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const DEFAULT_WATCH=["00700","09988","03690","08447","02342","00981","02800","01211"];
let raw=localStorage.getItem('mb_watch_v33');
let watchListCodes;
try{watchListCodes=raw?JSON.parse(raw):null;}catch(e){watchListCodes=null;}
if(!watchListCodes||!Array.isArray(watchListCodes)||watchListCodes.length===0){watchListCodes=[].concat(DEFAULT_WATCH);localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));}
let currentCode='00700',priceChart=null,tickStore={},pendingCode=null,allHot=[],hotFilter='all';
function switchTab(n){document.getElementById('tab1-btn').className=n===1?"flex-1 py-2 text-sm rounded-md bg-white text-black font-bold":"flex-1 py-2 text-sm rounded-md text-zinc-400";document.getElementById('tab2-btn').className=n===2?"flex-1 py-2 text-sm rounded-md bg-white text-black font-bold":"flex-1 py-2 text-sm rounded-md text-zinc-400";document.getElementById('tab2-content').classList.toggle('hidden',n!==2);}
function normalizeCode(c){return String(c).replace(/\D/g,'').padStart(5,'0');}
function formatP(v){return isNaN(v)?'--':Number(v).toFixed(3);}
function formatAmount(v){if(!v)return '--';v=Number(v);if(v>=1e8)return (v/1e8).toFixed(2)+'億';if(v>=1e4)return (v/1e4).toFixed(1)+'萬';return Math.round(v).toString();}
function addWatch(){let c=normalizeCode(document.getElementById('add-input').value);if(!c||c==='00000')return;if(watchListCodes.includes(c)){alert('HK.'+c+' 已在自選');return;}if(watchListCodes.length<10){watchListCodes.push(c);localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));document.getElementById('add-input').value='';refreshAll();}else{pendingCode=c;document.getElementById('replace-new-code').innerText='HK.'+c;let box=document.getElementById('replace-list');box.innerHTML=watchListCodes.map(function(code){return '<div onclick="doReplace(\''+code+'\')" class="flex justify-between items-center p-3 rounded-xl bg-zinc-900 border border-zinc-800"><span class="text-sm font-mono">HK.'+code+'</span><span class="text-xs bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">替換此隻</span></div>';}).join('');document.getElementById('replace-modal').classList.remove('hidden');}}
function doReplace(oldCode){if(!pendingCode)return;let idx=watchListCodes.indexOf(oldCode);if(idx>=0)watchListCodes[idx]=pendingCode;localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));closeReplace();document.getElementById('add-input').value='';refreshAll();}
function closeReplace(){document.getElementById('replace-modal').classList.add('hidden');pendingCode=null;}
function removeWatch(code){if(!confirm('確定刪除 HK.'+code+'？'))return;watchListCodes=watchListCodes.filter(function(x){return x!==code;});localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));refreshAll();}
function fetchQuotes(codes){return new Promise(function(res){let q=codes.map(function(x){return 'r_hk'+normalizeCode(x);}).join(',');let s=document.createElement('script');s.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now();let done=false;function finish(out){if(done)return;done=true;try{document.body.removeChild(s);}catch(e){}res(out);}s.onload=function(){let out={};codes.forEach(function(rc){let code=normalizeCode(rc);let raw=window['v_r_hk'+code];if(!raw)return;let p=raw.split('~');let price=parseFloat(p[3])||0;let prev=parseFloat(p[4])||price;if(!price)price=prev;if(!price)return;let high=parseFloat(p[33])||price;let low=parseFloat(p[34])||price;let vol=parseFloat(p[6])||0;let amount=parseFloat(p[37])||0;out[code]={code:code,name:p[1]||code,price:price,prev:prev,high:high,low:low,vol:vol,amount:amount,pct:prev?((price-prev)/prev*100):0};});finish(out);};s.onerror=function(){finish({});};document.body.appendChild(s);setTimeout(function(){finish({});},3500);});}
function filterHot(t){hotFilter=t;['all','up','down'].forEach(function(k){document.getElementById('f-'+k).className=k===t?"text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold":"text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400";});renderHot();}
function renderHot(){let box=document.getElementById('hot-list');let list=allHot;if(hotFilter==='up')list=list.filter(function(x){return x.change_pct>0;});if(hotFilter==='down')list=list.filter(function(x){return x.change_pct<0;});if(!list.length){box.innerHTML='<div class="text-xs text-zinc-500 py-2">收市時段 暫無異動</div>';return;}box.innerHTML=list.map(function(s){let up=s.change_pct>=0;let border=up?'border-l-emerald-500':'border-l-red-500';let txt=up?'text-emerald-400':'text-red-400';return '<div onclick="selectStock(\''+s.code+'\')" class="min-w-[150px] card-bg p-3 rounded-xl border border-zinc-800 border-l-4 '+border+'"><div class="font-black text-[13px] gold-light truncate">'+s.name+'</div><div class="text-[10px] text-zinc-500">HK.'+s.code+'</div><div class="mt-2 font-black text-sm '+txt+'">'+(s.change_pct>0?'+':'')+s.change_pct+'%</div></div>';}).join('');}
async function loadHot(){try{let r=await fetch('https://wingyuen28-cyber.github.io/moonbus-stock-Ai/hot_stocks.json?t='+Date.now(),{cache:'no-store'});let data=await r.json();allHot=data.data||[];document.getElementById('hot-count').innerText=allHot.length;renderHot();}catch(e){document.getElementById('hot-count').innerText='--';}}
async function refreshAll(){try{document.getElementById('watchlist-count').innerText=watchListCodes.length+'/10';document.getElementById('last-update').innerText=new Date().toLocaleTimeString();let data=await fetchQuotes(watchListCodes.concat([currentCode]));let cont=document.getElementById('stock-list');cont.innerHTML='';for(let i=0;i<watchListCodes.length;i++){let code=watchListCodes[i];let s=data[code];if(!s){cont.innerHTML+='<div class="card-bg p-3.5 rounded-xl border-2 border-white/30 flex justify-between"><span class="text-sm">HK.'+code+' 載入中...</span><button onclick="removeWatch(\''+code+'\')">✕</button></div>';continue;}let up=s.pct>0.05;let down=s.pct<-0.05;let borderColor=up?'border-emerald-500':down?'border-red-500':'border-white';let pctColor=up?'text-emerald-400':down?'text-red-400':'text-zinc-300';cont.innerHTML+='<div class="card-bg p-3.5 rounded-xl border-2 '+borderColor+' flex justify-between items-center shadow-[0_0_10px_rgba(0,0,0,0.5)]"><div onclick="selectStock(\''+s.code+'\')" class="flex-1"><div class="font-black text-[17px] gold-light">'+s.name+'</div><div class="text-[11px] text-zinc-400 font-mono mt-0.5">HK.'+s.code+' 高:'+formatP(s.high)+' 低:'+formatP(s.low)+'</div><div class="text-[11px] text-zinc-400 mt-1">成交額: <span class="text-zinc-100 font-bold">'+formatAmount(s.amount)+'</span> <span class="ml-2">'+formatAmount(s.vol)+'股</span></div></div><div class="flex items-center gap-2"><div onclick="selectStock(\''+s.code+'\')" class="text-right"><div class="font-black text-[16px] '+pctColor+'">$'+formatP(s.price)+'</div><div class="text-xs font-bold '+pctColor+'">'+(s.pct>0?'+':'')+s.pct.toFixed(2)+'%</div></div><button onclick="removeWatch(\''+s.code+'\')" class="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400">✕</button></div></div>';if(!tickStore[s.code])tickStore[s.code]=[];tickStore[s.code].push(s.price);if(tickStore[s.code].length>30)tickStore[s.code].shift();}if(data[currentCode]){document.getElementById('s-name').innerText=data[currentCode].name;document.getElementById('s-code').innerText='HK.'+data[currentCode].code;document.getElementById('s-price').innerText='$'+formatP(data[currentCode].price);let el=document.getElementById('s-change');el.innerText=(data[currentCode].pct>=0?'+':'')+data[currentCode].pct.toFixed(2)+'%';el.className='text-xs font-bold '+(data[currentCode].pct>0.05?'text-emerald-400':data[currentCode].pct<-0.05?'text-red-400':'text-zinc-300');document.getElementById('s-amount').innerText='成交額 '+formatAmount(data[currentCode].amount)+' / '+formatAmount(data[currentCode].vol)+'股';drawChart();}}catch(e){console.log('refresh err',e);}}
function drawChart(){try{let prices=tickStore[currentCode]||[];if(prices.length<2)return;let canvas=document.getElementById('priceChart');if(!canvas)return;let ctx=canvas.getContext('2d');if(priceChart)priceChart.destroy();let labels=[];for(let i=0;i<prices.length;i++)labels.push(i);priceChart=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:prices,borderColor:'#FACC15',backgroundColor:'rgba(250,204,21,0.1)',fill:true,tension:0.4,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});}catch(e){}}
async function selectStock(c){currentCode=normalizeCode(c);switchTab(2);await refreshAll();}
function initApp(){loadHot();refreshAll();setInterval(refreshAll,8000);}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp);}else{initApp();}
document.getElementById('replace-modal').addEventListener('click',function(e){if(e.target.id==='replace-modal')closeReplace();});
</script>
</body>
</html>
