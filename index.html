<!DOCTYPE html>
<html lang="zh-HK">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港股異動 V2.2修復</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0D1117;color:#E6EDF3}.card-bg{background:#161B22;border:1px solid #30363D}</style>
</head>
<body>
<header class="card-bg p-4"><div class="flex justify-between"><b>港股 AI 異動大師 V2.2</b><span id="db-status">連線中</span></div></header>
<main class="max-w-md mx-auto p-4 space-y-4">
<div class="flex bg-gray-900 p-1 rounded-lg">
<button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2 bg-indigo-600 rounded text-white">階段一</button>
<button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2 text-gray-400">階段二</button>
</div>

<section id="tab1-content" class="space-y-3">
<div id="hot-list" class="card-bg p-3 rounded">全場異動榜讀取中... (如果冇 hot_stocks.json 會顯示暫無)</div>
<div class="card-bg p-3 rounded"><input id="add-watchlist-input" placeholder="輸入 700" class="bg-gray-900 border border-gray-700 rounded px-3 py-2 w-3/4"><button onclick="handleAddWatchlist()" class="bg-indigo-600 px-3 py-2 rounded ml-2">加入</button></div>
<div id="stock-list" class="space-y-2"></div>
</section>

<section id="tab2-content" class="hidden space-y-3">
<div class="card-bg p-3 rounded flex"><input id="search-input" value="00700" class="bg-gray-900 border rounded px-3 py-2 flex-1"><button onclick="handleSearch()" class="bg-indigo-600 px-4 rounded ml-2">分析</button></div>
<div class="card-bg p-4 rounded"><h2 id="stock-name">--</h2><div id="stock-code">HK.-----</div><div id="stock-price" class="text-2xl font-black">$0.000</div><div id="stock-change">0%</div></div>
<div class="card-bg p-3 rounded text-xs"><div>買盤 <span id="buy-pct">0%</span> 沽盤 <span id="sell-pct">0%</span> 量比 <span id="vol-ratio-disp">1x</span></div></div>
</section>
</main>

<script>
// 最核心，放在最前，保證一定可以切換
function switchTab(n){
  document.getElementById('tab1-content').style.display = n===1?'block':'none';
  document.getElementById('tab2-content').style.display = n===2?'block':'none';
  document.getElementById('tab1-btn').className = n===1?'flex-1 py-2 bg-indigo-600 rounded text-white':'flex-1 py-2 text-gray-400';
  document.getElementById('tab2-btn').className = n===2?'flex-1 py-2 bg-indigo-600 rounded text-white':'flex-1 py-2 text-gray-400';
}
let watchListCodes = ['00700','09988','03690','08447'];
function normalizeCode(c){return String(c).replace(/\D/g,'').padStart(5,'0');}
function fetchQuote(codes){return new Promise(r=>{let id='qt';let old=document.getElementById(id);if(old)old.remove();let q=codes.map(x=>'r_hk'+normalizeCode(x)).join(',');let s=document.createElement('script');s.id=id;s.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now();s.onload=()=>{let o={};codes.forEach(code=>{let raw=window['v_r_hk'+normalizeCode(code)];if(!raw)return;let p=raw.split('~');o[normalizeCode(code)]={code:normalizeCode(code),name:p[1],price:parseFloat(p[3]),prev:parseFloat(p[4]),change:parseFloat(p[3])-parseFloat(p[4]),pct:((parseFloat(p[3])-parseFloat(p[4]))/parseFloat(p[4])*100)};});r(o);};s.onerror=()=>r({});document.body.appendChild(s);});}
async function refresh(){let data=await fetchQuote(watchListCodes);let cont=document.getElementById('stock-list');cont.innerHTML='';Object.values(data).forEach(s=>{cont.innerHTML+=`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded cursor-pointer"><b>${s.name}</b> ${s.code} $${s.price} <span class="${s.pct>=0?'text-green-400':'text-red-400'}">${s.pct.toFixed(2)}%</span></div>`;});document.getElementById('db-status').innerText='實時連線中';}
async function selectStock(c){let code=normalizeCode(c);let data=await fetchQuote([code]);let s=data[code];if(!s)return;document.getElementById('stock-name').innerText=s.name;document.getElementById('stock-code').innerText='HK.'+s.code;document.getElementById('stock-price').innerText='$'+s.price;document.getElementById('stock-change').innerText=s.pct.toFixed(2)+'%';switchTab(2);}
function handleAddWatchlist(){let c=normalizeCode(document.getElementById('add-watchlist-input').value);if(c&&!watchListCodes.includes(c))watchListCodes.push(c);refresh();}
function handleSearch(){selectStock(document.getElementById('search-input').value);}
window.onload=()=>{refresh();setInterval(refresh,8000);};
// hot榜容錯讀取，失敗都唔會卡死
fetch('hot_stocks.json').then(r=>r.json()).then(j=>{let list=j.data||[];let box=document.getElementById('hot-list');if(list.length===0){box.innerHTML='暫無異動股 (未生成 hot_stocks.json)';return;}box.innerHTML='';list.slice(0,10).forEach(s=>{box.innerHTML+=`<div onclick="selectStock('${s.code}')" class="border-2 border-yellow-400 rounded p-2 mb-2 cursor-pointer">💎 ${s.name} ${s.code} ${s.change_pct}% ${s.reason}</div>`;});}).catch(()=>{document.getElementById('hot-list').innerHTML='暫無 hot_stocks.json，請先跑 generate_stocks.py V2';});
</script>
</body>
</html>
