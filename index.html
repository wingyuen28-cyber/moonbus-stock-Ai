<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoonBus Stock Select AI</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json?v=40">
<meta name="theme-color" content="#facc15">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0D1117;color:#E6EDF3}
.card-bg{background:#161B22;border:1px solid #2A3038}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
#splash{position:fixed;inset:0;background:#0D1117;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>
<body class="pb-20">
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
setTimeout(()=>{var s=document.getElementById('splash');if(s)s.style.display='none';},800);
</script>
<div id="splash"><img src="icon-512.png" style="width:88px;height:88px;border-radius:16px"><div style="color:#facc15;font-weight:900;margin-top:14px;letter-spacing:.15em">MOONBUS V4.0</div></div>

<header class="sticky top-0 z-40 bg-[#0D1117]/95 backdrop-blur px-4 py-3 border-b border-zinc-800">
<div class="flex justify-between items-center max-w-md mx-auto">
<h1 class="font-black flex items-center gap-2 text-sm"><img src="icon-512.png" class="w-7 h-7 rounded-lg"> MOONBUS <span class="text-yellow-400">STOCK SELECT AI</span> <span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-black">V4.0</span></h1>
<div class="text-[10px] text-emerald-400">● 實時</div>
</div>
</header>

<main class="max-w-md mx-auto px-4 mt-3 space-y-4">
<!-- 1. 自選置頂 -->
<section class="space-y-2">
<div class="flex justify-between items-center">
<span class="text-sm font-bold">⭐ 自選監測 <span id="watchlist-count" class="text-indigo-400 font-mono ml-1">--</span></span>
<span id="last-update" class="text-[10px] text-zinc-500 font-mono">--:--:--</span>
</div>
<div class="card-bg p-2.5 rounded-xl flex gap-2">
<input id="add-input" inputmode="numeric" placeholder="輸入 00700" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none">
<button onclick="addWatch()" class="bg-yellow-400 text-black font-black px-5 rounded-lg text-sm">加入</button>
</div>
<div id="stock-list" class="space-y-2"></div>
</section>

<!-- 2. 異動改橫向 -->
<section class="space-y-2">
<div class="flex justify-between items-center">
<span class="text-sm font-bold">📊 異動 <span id="hot-count" class="text-yellow-400 font-mono ml-1">--</span></span>
<div class="flex gap-1"><button onclick="filterHot('all')" id="f-all" class="text-[10px] px-2 py-1 rounded-full bg-white text-black">全部</button><button onclick="filterHot('up')" id="f-up" class="text-[10px] px-2 py-1 rounded-full bg-zinc-800 text-zinc-400">急升</button><button onclick="filterHot('down')" id="f-down" class="text-[10px] px-2 py-1 rounded-full bg-zinc-800 text-zinc-400">急跌</button></div>
</div>
<div id="hot-list" class="flex gap-
