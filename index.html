<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港股 AI 異動大師 V2.6</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{background:#0D1117;color:#E6EDF3}.hk-up{color:#30D158}.hk-down{color:#FF3B30}.card-bg{background:#161B22;border:1px solid #30363D}.hot-gem{border-color:#A855F7!important;box-shadow:0 0 12px rgba(168,85,247,.4)}.hot-main{border-color:#FACC15!important;box-shadow:0 0 12px rgba(250,204,21,.4)}</style>
</head>
<body class="pb-10">
<header class="sticky top-0 z-50 card-bg px-4 py-3">
<div class="flex justify-between items-center max-w-md mx-auto"><h1 class="font-bold text-white">港股 AI 異動大師 <span class="text-xs px-2 py-0.5 rounded bg-green-900 text-green-300">V2.6 修復</span></h1><div class="text-xs"><span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span> 實時連線中</div></div>
<div class="flex justify-between max-w-md mx-auto mt-2 pt-2 border-t border-gray-800 text-xs text-gray-400"><div>自訂:<span id="watchlist-count" class="text-indigo-400 font-bold ml-1">--</span></div><div>異動榜:<span id="hot-count" class="text-yellow-400 font-bold ml-1">--</span></div><div id="last-update">--:--:--</div></div>
</header>
<main class="max-w-md mx-auto px-4 mt-4 space-y-4">
<section class="card-bg p-3 rounded-xl border border-yellow-900/50">
<div class="flex justify-between items-center"><span class="text-yellow-400 font-black text-sm">💎 全場異動榜</span><button onclick="loadHot()" class="text-[11px] text-yellow-400 underline">刷新榜單</button></div>
<div id="hot-list" class="space-y-2 mt-2 text-xs text-center py-2">讀取中...</div>
</section>
<div class="flex rounded-lg bg-gray-900 p-1 border border-gray-800">
<button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2 text-sm rounded-md bg-indigo-600 text-white">階段一：自訂監測</button>
<button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2 text-sm rounded-md text-gray-400">階段二：深度分析</button>
</div>
<section id="tab1-content" class="space-y-3">
<div class="card-bg p-3 rounded-xl"><div class="flex space-x-2"><input id="add-input" placeholder="如 2342,8447" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm"><button onclick="addWatch()" class="bg-indigo-600 px-4 rounded-lg text-sm">加入</button></div></div>
<div id="stock-list" class="space-y-2"></div>
</section>
<section id="tab2-content" class="space-y-4 hidden">
<div class="card-bg p-3 rounded-xl flex space-x-2"><input id="search-input" value="00700" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm"><button onclick="doSearch()" class="bg-indigo-600 px-4 rounded-lg text-sm">分析</button></div>
<div class="card-bg p-4 rounded-xl">
<div class="flex justify-between"><div><h2 id="s-name" class="font-bold">---</h2><div id="s-code" class="text-xs text-gray-400">HK.-----</div></div><div class="text-right"><div id="s-price" class="text-2xl font-black">$0.000</div><div id="s-change" class="text-xs">0.00%</div></div></div>
<div class="h-32 mt-3"><canvas id="priceChart"></canvas></div>
<div class="h-24 mt-2"><canvas id="volChart"></canvas></div>
<div class="grid grid-cols-4 gap-2 pt-2 mt-2 border-t border-gray-800 text-center text-[11px] text-gray-400"><div>昨收<br><span id="s-prev" class="text-white">--</span></div><div>今開<br><span id="s-open" class="text-white">--</span></div><div>最高<br><span id="s-high" class="text-white">--</span></div><div>最低<br><span id="s-low" class="text-white">--</span></div></div>
</div>
</section>
</main>
<script>
function switchTab(n){
 document.getElementById('tab1-content').classList.toggle('hidden', n!==1);
 document.getElementById('tab2-content').classList.toggle('hidden', n!==2);
 document.getElementById('tab1-btn').className = n===1? "flex-1 py-2 text-sm rounded-md bg-indigo-600 text-white" : "flex-1 py-2 text-sm rounded-md text-gray-400";
 document.getElementById('tab2-btn').className = n===2? "flex-1 py-2 text-sm rounded-md bg-indigo-600 text-white" : "flex-1 py-2 text-sm rounded-md text-gray-400";
}
let watchListCodes = JSON.parse(localStorage.getItem('hk_watch_v26')||'["00700","09988","03690","08447","02342","00981","02800","01211"]');
let currentCode='00700', priceChart=null, volChart=null, tickStore={};
function normalizeCode(c){return String(c).replace(/\D/g,'').padStart(5,'0');}
function formatP(v){return isNaN(v)?'--':Number(v).toFixed(3);}
function addWatch(){let c=normalizeCode(document.getElementById('add-input').value); if(!c) return; if(watchListCodes.includes(c)) return alert('已存在'); if(watchListCodes.length>=10) return alert('最多10隻'); watchListCodes.push(c); localStorage.setItem('hk_watch_v26',JSON.stringify(watchListCodes)); document.getElementById('add-input').value=''; refreshAll();}
function removeWatch(e,code){e.stopPropagation(); watchListCodes=watchListCodes.filter(x=>x!==code); localStorage.setItem('hk_watch_v26',JSON.stringify(watchListCodes)); refreshAll();}
function fetchQuotes(codes){
 return new Promise(res=>{
  let id='qt'; let old=document.getElementById(id); if(old) old.remove();
  let q=codes.map(x=>'r_hk'+normalizeCode(x)).join(',');
  let s=document.createElement('script'); s.id=id; s.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now();
  s.onload=()=>{let out={}; codes.forEach(rc=>{let code=normalizeCode(rc); let raw=window['v_r_hk'+code]; if(!raw) return; let p=raw.split('~'); let price=parseFloat(p[3])||0, prev=parseFloat(p[4])||0, open=parseFloat(p[5])||0, high=parseFloat(p[33])||price, low=parseFloat(p[34])||price; if(price===0) return; let pct=prev?((price-prev)/prev*100):0; let outer=parseFloat(p[7])||0, inner=parseFloat(p[8])||0, tot=outer+inner, buy=50; if(tot>0) buy=Math.round(outer/tot*100); let vol=parseFloat(p[49])||1; out[code]={code,name:p[1]||code,price,prev,open,high,low,pct,buyPct:buy,vol}; }); res(out);};
  s.onerror=()=>res({}); document.body.appendChild(s);
 });
}
async function loadHot(){
 let urls=['hot_stocks.json','www/hot_stocks.json']; let data=null;
 for(let u of urls){try{let r=await fetch(u+'?t='+Date.now()); if(r.ok){data=await r.json(); if(data) break;}}catch(e){}}
 let box=document.getElementById('hot-list'), countEl=document.getElementById('hot-count');
 if(!data||!data.data||data.data.length===0){box.innerHTML='<div class="text-gray-500">今日暫無異動，市場平靜中</div>'; if(countEl) countEl.innerText='0隻'; return;}
 if(countEl) countEl.innerText=data.data.length+'隻'; box.innerHTML='';
 data.data.forEach(s=>{
  let isUp=s.change_pct>=0; let isGem=s.is_gem||(s.category&&s.category.includes('創業板'));
  let border=isGem?'hot-gem':'hot-main'; let badge=isGem?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-purple-900 text-purple-300 ml-1">創業板</span>':'<span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-900 text-yellow-300 ml-1">💎金檔</span>';
  box.innerHTML+=`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded-xl border-2 ${border} cursor-pointer text-left"><div class="flex justify-between items-center"><span class="font-bold text-white text-[13px]">${s.name} <span class="text-gray-400 text-xs">HK.${s.code}</span>${badge}</span><span class="${isUp?'text-green-400':'text-red-400'} font-black text-sm">${isUp?'▲+':'▼'}${s.change_pct}%</span></div><div class="text-[11px] text-gray-300 mt-1">${s.reason} | 量比 ${s.vol_ratio}x</div></div>`;
 });
}
async function refreshAll(){
 document.getElementById('watchlist-count').innerText=watchListCodes.length+'/10';
 let all=[...new Set([...watchListCodes, currentCode])]; let data=await fetchQuotes(all);
 document.getElementById('last-update').innerText=new Date().toLocaleTimeString();
 let cont=document.getElementById('stock-list'); cont.innerHTML='';
 watchListCodes.forEach(code=>{
  let s=data[code]; if(!s) return;
  let up=s.pct>=0;
  cont.innerHTML+=`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded-xl cursor-pointer flex justify-between items-center"><div><div class="font-bold text-white text-sm">${s.name} <span class="text-xs text-gray-400">HK.${s.code}</span></div><div class="text-xs text-gray-400 mt-1">量比 ${s.vol.toFixed(2)}x | 買盤 ${s.buyPct}%</div></div><div class="text-right"><div class="font-black ${up?'text-green-400':'text-red-400'}">$${formatP(s.price)}</div><div class="text-xs ${up?'text-green-400':'text-red-400'}">${s.pct.toFixed(2)}%</div><button onclick="removeWatch(event,'${s.code}')" class="text-[10px] text-gray-500 underline">移除</button></div></div>`;
  if(!tickStore[s.code]) tickStore[s.code]=[]; tickStore[s.code].push({t:Date.now(),price:s.price}); if(tickStore[s.code].length>30) tickStore[s.code].shift();
 });
 if(data[currentCode]) updateDetail(data[currentCode]);
}
function updateDetail(s){
 document.getElementById('s-name').innerText=s.name; document.getElementById('s-code').innerText='HK.'+s.code; document.getElementById('s-price').innerText='$'+formatP(s.price); document.getElementById('s-change').innerText=(s.pct>=0?'+':'')+s.pct.toFixed(2)+'%'; document.getElementById('s-change').className=s.pct>=0?'text-xs text-green-400':'text-xs text-red-400';
 document.getElementById('s-prev').innerText=formatP(s.prev); document.getElementById('s-open').innerText=formatP(s.open); document.getElementById('s-high').innerText=formatP(s.high); document.getElementById('s-low').innerText=formatP(s.low);
 let hist=tickStore[s.code]||[{price:s.price}]; renderCharts(hist,s.pct>=0);
}
function renderCharts(hist,isUp){
 let labels=hist.map((_,i)=>i); let prices=hist.map(h=>h.price);
 let ctx=document.getElementById('priceChart').getContext('2d'); if(priceChart) priceChart.destroy();
 priceChart=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:prices,borderColor:isUp?'#30D158':'#FF3B30',backgroundColor:isUp?'rgba(48,209,88,0.15)':'rgba(255,59,48,0.15)',fill:true,tension:0.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});
 let ctx2=document.getElementById('volChart').getContext('2d'); if(volChart) volChart.destroy();
 volChart=new Chart(ctx2,{type:'bar',data:{labels:labels,datasets:[{data:prices,backgroundColor:'#3B82F6'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});
}
async function selectStock(c){currentCode=normalizeCode(c); let d=await fetchQuotes([currentCode]); if(d[currentCode]){updateDetail(d[currentCode]); switchTab(2);} }
function doSearch(){let v=document.getElementById('search-input').value; if(v) selectStock(v);}
window.onload=async()=>{await loadHot(); await refreshAll(); setInterval(refreshAll,8000);};
</script>
</body>
</html>
