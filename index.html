<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoonBus Stock Select AI</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json?v=36">
<meta name="theme-color" content="#facc15">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0D1117;color:#E6EDF3}.card-bg{background:#161B22;border:1px solid #2A3038}
#splash{position:fixed;inset:0;background:#0D1117;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center}
#splash.out{animation:fadeOut.5s forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.bus-anim{animation:drive 1.2s infinite alternate}
@keyframes drive{0%{transform:translateX(-8px)}100%{transform:translateX(8px)}}
</style>
</head>
<body class="pb-10">
<div id="splash">
<img src="icon-512.png" class="w-24 h-24 rounded-2xl bus-anim">
<div class="text-yellow-400 font-black mt-4 tracking-[0.2em]">MOONBUS DEPARTING...</div>
<div class="text-zinc-600 text-xs mt-2 font-mono">V3.6 PWA • AI TERMINAL</div>
</div>

<header class="sticky top-0 z-40 card-bg px-4 py-3">
<div class="flex justify-between items-center max-w-md mx-auto">
<h1 class="font-black flex items-center gap-2"><img src="icon-512.png" class="w-7 h-7 rounded-lg"> MOONBUS <span class="text-yellow-400">STOCK SELECT AI</span> <span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-black">V3.6</span></h1>
<div class="text-[11px] text-zinc-400">● 實時行情</div>
</div>
<div class="flex justify-between max-w-md mx-auto mt-2 pt-2 border-t border-zinc-800 text-xs text-zinc-500 font-mono"><div>自選:<span id="watchlist-count" class="text-indigo-400 font-bold ml-1">--</span></div><div>異動:<span id="hot-count" class="text-yellow-400 font-bold ml-1">--</span></div><div id="last-update">--:--:--</div></div>
</header>

<main class="max-w-md mx-auto px-4 mt-4 space-y-4">
<section class="card-bg p-3 rounded-xl"><div class="flex justify-between"><span class="text-sm font-bold">📊 全市場異動掃描</span><button onclick="loadHot()" class="text-[11px] underline text-zinc-500">刷新</button></div><div id="hot-list" class="mt-3 text-xs text-center text-zinc-500 py-2">掃描中...</div></section>
<div class="flex bg-zinc-900 p-1 border border-zinc-800 rounded-lg"><button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2 text-sm rounded-md bg-white text-black font-bold">自選監測</button><button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2 text-sm rounded-md text-zinc-400">深度分析</button></div>
<section id="tab1-content" class="space-y-3"><div class="card-bg p-3 rounded-xl flex gap-2"><input id="add-input" placeholder="00700" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm"><button onclick="addWatch()" class="bg-white text-black font-bold px-5 rounded-lg">加入</button><button onclick="Notification.requestPermission()" class="bg-yellow-400 text-black font-bold px-3 rounded-lg text-xs">🔔</button></div><div id="stock-list" class="space-y-2"></div></section>
<section id="tab2-content" class="hidden"><div class="card-bg p-4 rounded-xl"><div class="flex justify-between"><div><h2 id="s-name">---</h2><div id="s-code" class="text-xs text-zinc-500">HK.-----</div></div><div class="text-right"><div id="s-price" class="text-2xl font-black">$0.000</div><div id="s-change" class="text-xs">0.00%</div></div></div><div class="h-32 mt-3"><canvas id="priceChart"></canvas></div></div></section>
</main>

<script>
// 1. 自動1.5秒關屏，不用點
setTimeout(()=>{document.getElementById('splash').classList.add('out');},1500);

function switchTab(n){document.getElementById('tab1-content').classList.toggle('hidden',n!==1);document.getElementById('tab2-content').classList.toggle('hidden',n!==2);}
let watchListCodes=JSON.parse(localStorage.getItem('mb_watch_v33')||'["00700","09988","03690","08447","02342","00981","02800","01211"]');
let currentCode='00700',priceChart=null,tickStore={};
function normalizeCode(c){return String(c).replace(/\D/g,'').padStart(5,'0');}function formatP(v){return isNaN(v)?'--':Number(v).toFixed(3);}
function addWatch(){let c=normalizeCode(document.getElementById('add-input').value);if(!c)return;if(watchListCodes.includes(c))return alert('已在自選');watchListCodes.push(c);localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));refreshAll();}
function fetchQuotes(codes){return new Promise(res=>{let q=codes.map(x=>'r_hk'+normalizeCode(x)).join(',');let s=document.createElement('script');s.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now();s.onload=()=>{let out={};codes.forEach(rc=>{let code=normalizeCode(rc);let raw=window['v_r_hk'+code];if(!raw)return;let p=raw.split('~');let price=parseFloat(p[3])||0,prev=parseFloat(p[4])||0;if(!price)return;out[code]={code,name:p[1]||code,price,prev,pct:prev?((price-prev)/prev*100):0};});res(out);};s.onerror=()=>res({});document.body.appendChild(s);setTimeout(()=>res({}),4000);});}
async function loadHot(){
  let box=document.getElementById('hot-list');
  try{
    let r=await fetch('https://wingyuen28-cyber.github.io/moonbus-stock-Ai/hot_stocks.json?t='+Date.now(),{cache:'no-store'});
    let data=await r.json();
    document.getElementById('hot-count').innerText=data.data?.length||0;
    if(!data.data||!data.data.length){box.innerHTML='市場平穩';return;}
    box.innerHTML=data.data.map(s=>`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded-xl border text-left mb-2"><div class="flex justify-between"><span class="font-bold">${s.name} HK.${s.code}</span><span class="${s.change_pct>=0?'text-emerald-400':'text-red-400'}">${s.change_pct}%</span></div></div>`).join('');
  }catch(e){box.innerHTML='暫無數據 (GitHub Actions 12小時更新一次)';document.getElementById('hot-count').innerText='0';}
}
async function refreshAll(){
  document.getElementById('watchlist-count').innerText=watchListCodes.length+'/10';
  document.getElementById('last-update').innerText=new Date().toLocaleTimeString();
  let data=await fetchQuotes([...new Set([...watchListCodes,currentCode])]);
  let cont=document.getElementById('stock-list');cont.innerHTML='';
  watchListCodes.forEach(code=>{
    let s=data[code];
    if(!s){cont.innerHTML+=`<div class="card-bg p-3 rounded-xl text-sm text-zinc-500">HK.${code} 載入中...</div>`;return;}
    let up=s.pct>=0;
    cont.innerHTML+=`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded-xl flex justify-between"><div><div class="font-bold text-sm">${s.name} <span class="text-xs text-zinc-500">HK.${s.code}</span></div></div><div class="text-right"><div class="font-black ${
