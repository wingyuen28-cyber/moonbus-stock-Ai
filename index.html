function fetchQ(codes){return new Promise(function(res){var q=codes.map(function(x){return 'r_hk'+norm(x)}).join(',');var s=document.createElement('script');s.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now();var done=false;function fin(o){if(done)return;done=true;try{document.body.removeChild(s)}catch(e){}res(o)}s.onload=function(){var o={};codes.forEach(function(rc){var code=norm(rc);var raw=window['v_r_hk'+code];if(!raw)return;var p=raw.split('~');var price=parseFloat(p[3])||0;var prev=parseFloat(p[4])||price;var open=parseFloat(p[5])||price;if(!price)price=prev;if(!price)return;var high=parseFloat(p[33])||price;var low=parseFloat(p[34])||price;var vol=parseFloat(p[6])||0;var amt=parseFloat(p[37])||0;var bids=[];var asks=[];for(var i=0;i<5;i++){var bp=parseFloat(p[9+i])||0;var bv=parseFloat(p[19+i])||0;var ap=parseFloat(p[29+i])||0;var av=parseFloat(p[39+i])||0;if(bp>0.001&&bp<price*1.8)bids.push({price:bp,vol:bv||10000});if(ap>0.001&&ap<price*1.8)asks.push({price:ap,vol:av||10000})}if(bids.length==0){for(var i=1;i<=5;i++)bids.push({price:price-0.01*i,vol:30000})}if(asks.length==0){for(var i=1;i<=5;i++)asks.push({price:price+0.01*i,vol:30000})}var bSum=0;var aSum=0;for(var j=0;j<bids.length;j++)bSum+=bids[j].vol;for(var k=0;k<asks.length;k++)aSum+=asks[k].vol;var ratio=bSum/(aSum||1);if(ratio>9.9)ratio=9.9;if(ratio<0.1)ratio=0.1;o[code]={code:code,name:nameOf(code,p[1]),price:price,prev:prev,open:open,high:high,low:low,vol:vol,amount:amt,pct:prev?((price-prev)/prev*100):0,bids:bids,asks:asks,ratio:ratio}});fin(o)};s.onerror=function(){fin({})};document.body.appendChild(s);setTimeout(function(){fin({})},4000)})}
function calcPro(s){var range=(s.high-s.low)/s.prev*100||0;var vScore=s.amount>=5e8?40:s.amount>=1e8?30:s.amount>=5e7?20:s.amount>=1e7?10:2;var tScore=s.pct>5?30:s.pct>3?28:s.pct>1?22:s.pct>-1?15:s.pct>-3?10:5;var rScore=range>15?5:range>10?12:range>6?18:25;var bBonus=s.ratio>1.5?5:s.ratio<0.6?-5:0;var total=vScore+tScore+rScore+bBonus;if(total<5)total=5;if(total>95)total=95;var rating=total>=85?'💎 強力買入':total>=70?'🚀 買入':total>=50?'👀 觀望':total>=30?'⚠️ 避險':'💀 仙股警告';var trend=s.pct>1?'上升':s.pct<-1?'下跌':'橫行';var sup=(s.low*0.98).toFixed(3);var resi=(s.high*1.02).toFixed(3);var strat=total>=70?'逢低吸納':total>=50?'低吸高拋':total>=30?'反彈減磅':'觀望為主';var base=PROFILE[s.code]||s.name;var comment=base+'。現價 $'+fmtP(s.price)+' 振幅 '+range.toFixed(2)+'%
