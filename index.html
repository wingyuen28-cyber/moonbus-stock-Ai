function norm(c){return String(c).replace(/\D/g,'').padStart(5,'0')}
function fmtP(v){return isNaN(v)?'--':Number(v).toFixed(v>=10?2:3)}
function fmtAmt(v){if(!v)return'--';v=Number(v);if(v>=1e8)return(v/1e8).toFixed(2)+'億';if(v>=1e4)return(v/1e4).toFixed(1)+'萬';return Math.round(v)+''}

function delWatch(c){if(!confirm('刪除 HK.'+c+'?'))return;watch=watch.filter(x=>x!=c);localStorage.setItem('mb_watch_v33',JSON.stringify(watch));refresh()}

function calc(s){

let trend=s.pct>1?'上升':s.pct<-1?'下跌':'橫行';

let comment='京信通信 5G天線龍頭。現價 $'+s.price.toFixed(3)+' 振幅 '+range.toFixed(1)+'% 成交 '+fmtAmt(s.amount)+'。'+(s.ratio>1.2?'買盤承接強。':'沽壓較重。');
return {total,rating,trend,sup,resi,strat,comment,range,vScore,tScore,rScore,bBonus}
}
