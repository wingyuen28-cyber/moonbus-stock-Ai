<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoonBus 股票精選 AI</title>
<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json?v=51">
<meta name="theme-color" content="#FACC15">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0D1117;color:#E6EDF3}.card-bg{background:#161B22}.gold{color:#FACC15}.gold-light{color:#FDE68A}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}#splash{position:fixed;inset:0;background:#0D1117;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}</style>
</head>
<body class="pb-28">
<div id="splash"><img src="icon-512.png" style="width:88px;height:88px;border-radius:16px"><div style="color:#facc15;font-weight:900;margin-top:12px">MOONBUS V5.1 DEEP FIX</div></div>
<script>
setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';s.style.transition='0.4s';setTimeout(function(){s.style.display='none';},350);}},1200);
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
</script>
<header class="sticky top-0 z-40 bg-[#0D1117]/95 backdrop-blur px-4 py-3 border-b border-zinc-800"><div class="flex justify-between items-center max-w-md mx-auto"><h1 class="font-black flex items-center gap-2 text-[13px]"><img src="icon-512.png" class="w-7 h-7 rounded-lg"><span class="gold">MOONBUS 股票精選 AI</span><span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-black">V5.1</span></h1><div class="text-[10px] text-emerald-400">● 即時</div></div></header>

<main class="max-w-md mx-auto px-4 mt-3 space-y-4">
<section id="tab1-wrap" class="space-y-3">
<div class="flex justify-between items-center"><span class="text-[15px] font-black gold">⭐ 自選監測 <span id="watchlist-count" class="text-indigo-300 font-mono ml-1">--</span></span><span class="flex gap-2 items-center"><span id="last-update" class="text-[10px] text-zinc-500">--:--:--</span><button onclick="localStorage.setItem('mb_watch_v33',JSON.stringify(DEFAULT_WATCH));location.reload();" class="text-[10px] bg-yellow-400 text-black px-2.5 py-1 rounded-full font-black">重設8隻</button></span></div>
<div class="card-bg p-2.5 rounded-xl flex gap-2 border border-zinc-800"><input id="add-input" inputmode="numeric" placeholder="輸入代號 如 00700" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none"><button onclick="addWatch()" class="bg-[#FACC15] text-black font-black px-5 rounded-lg text-sm">加入</button></div>
<div id="stock-list" class="space-y-3 text-xs text-zinc-500">載入中...</div>
<div class="space-y-2 pt-1"><div class="flex justify-between items-center"><span class="text-[14px] font-black gold">📊 異動掃描 <span id="hot-count" class="text-yellow-400 font-mono ml-1">--</span></span><div class="flex gap-1"><button onclick="filterHot('all')" id="f-all" class="text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold">全部</button><button onclick="filterHot('up')" id="f-up" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急升</button><button onclick="filterHot('down')" id="f-down" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急跌</button></div></div><div id="hot-list" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 text-xs text-zinc-500">載入中...</div></div>
</section>

<section id="tab2-content" class="hidden space-y-3">
<div class="card-bg p-4 rounded-xl border border-zinc-800">
<div class="flex justify-between items-start"><div><h2 id="s-name" class="font-black text-[18px] gold-light">--</h2><div id="s-code" class="text-xs text-zinc-500 font-mono">HK.-----</div><div class="flex gap-2 mt-2"><span id="s-rating-badge" class="text-[10px] px-2 py-1 rounded-full bg-zinc-800 text-zinc-300">評級: --</span><span id="s-trend-badge" class="text-[10px] px-2 py-1 rounded-full bg-zinc-800 text-zinc-400">趨勢: --</span></div></div><div class="text-right"><div id="s-price" class="text-[26px] font-black">$--</div><div id="s-change" class="text-sm font-bold">--</div><div id="s-amount" class="text-[10px] text-zinc-400 mt-1">成交額 --</div></div></div>
<div class="h-[190px] mt-4 w-full"><canvas id="priceChart"></canvas></div>
<div class="grid grid-cols-3 gap-2 mt-4 text-[11px]"><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">今開</div><div id="d-open" class="font-bold">--</div></div><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">昨收</div><div id="d-prev" class="font-bold">--</div></div><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">振幅</div><div id="d-range" class="font-bold">--</div></div><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">最高</div><div id="d-high" class="font-bold text-emerald-400">--</div></div><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">最低</div><div id="d-low" class="font-bold text-red-400">--</div></div><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">成交量</div><div id="d-vol" class="font-bold">--</div></div></div>
</div>
<div class="card-bg p-4 rounded-xl border border-amber-500/20"><div class="flex justify-between items-center"><span class="text-[13px] font-black gold">🤖 AI 深度診斷</span><span id="ai-score" class="text-[11px] px-2 py-1 rounded bg-yellow-400 text-black font-black">-- /100</span></div><div class="mt-3 space-y-2 text-[12px] leading-6"><div class="flex justify-between"><span class="text-zinc-500">壓力位</span><span id="ai-resist" class="font-mono font-bold">--</span></div><div class="flex justify-between"><span class="text-zinc-500">支撐位</span><span id="ai-support" class="font-mono font-bold">--</span></div><div class="flex justify-between"><span class="text-zinc-500">短線策略</span><span id="ai-strategy" class="font-bold gold-light">--</span></div><div class="pt-2 border-t border-zinc-800 text-zinc-300" id="ai-comment">載入中...</div></div></div>
<div class="card-bg p-4 rounded-xl border border-zinc-800"><div class="text-[13px] font-black gold mb-2">📈 技術指標</div><div class="space-y-2 text-[11px]"><div class="flex justify-between"><span class="text-zinc-500">MA5 / MA20</span><span id="ind-ma" class="font-mono">-- / --</span></div><div class="flex justify-between"><span class="text-zinc-500">RSI (14)</span><span id="ind-rsi" class="font-mono">--</span></div><div class="flex justify-between"><span class="text-zinc-500">量比</span><span id="ind-volratio" class="font-mono">--</span></div></div></div>
</section>

<div class="flex bg-zinc-900 p-1 border border-zinc-800 rounded-xl fixed bottom-4 left-4 right-4 max-w-md mx-auto z-30"><button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2.5 text-sm rounded-lg bg-white text-black font-black">自選</button><button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2.5 text-sm rounded-lg text-zinc-400">深度分析</button></div>
</main>

<div id="replace-modal" class="fixed inset-0 bg-black/75 z-[100] hidden flex items-end justify-center"><div class="bg-[#161B22] w-full max-w-md rounded-t-2xl p-4 border-t border-zinc-700"><div class="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-3"></div><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm gold">自選已滿 10/10</h3><button onclick="closeReplace()" class="w-7 h-7 rounded-full bg-zinc-800">✕</button></div><div class="text-xs text-zinc-400 mb-2">新股 <span id="replace-new-code" class="text-yellow-400 font-bold"></span> 要替換邊一隻？</div><div id="replace-list" class="space-y-2 max-h-72 overflow-auto"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const DEFAULT_WATCH=["00700","09988","03690","08447","02342","00981","02800","01211"];
const TRAD_MAP={"00700":"騰訊控股","09988":"阿里巴巴","03690":"美團","08447":"MS CONCEPT","02342":"京信通信","00981":"中芯國際","02800":"盈富基金","01211":"比亞迪股份","01816":"中廣核電力","00836":"華潤電力","02318":"中國平安"};
let raw=localStorage.getItem('mb_watch_v33');
let watchListCodes;
try{watchListCodes=raw?JSON.parse(raw):null;}catch(e){watchListCodes=null;}
if(!watchListCodes||!Array.isArray(watchListCodes)||watchListCodes.length===0){watchListCodes=DEFAULT_WATCH.slice();localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));}
let currentCode='00700',priceChart=null,tickStore={},pendingCode=null,allHot=[],hotFilter='all',detailStore={};
function switchTab(n){document.getElementById('tab1-wrap').classList.toggle('hidden',n===2);document.getElementById('tab2-content').classList.toggle('hidden',n!==2);document.getElementById('tab1-btn').className=n===1?"flex-1 py-2.5 text-sm rounded-lg bg-white text-black font-black":"flex-1 py-2.5 text-sm rounded-lg text-zinc-400";document.getElementById('tab2-btn').className=n===2?"flex-1 py-2.5 text-sm rounded-lg bg-white text-black font-black":"flex-1 py-2.5 text-sm rounded-lg text-zinc-400";}
function normalizeCode(c){return String(c).replace(/\D/g,'').padStart(5,'0');}
function formatP(v){if(v===undefined||v===null||isNaN(v))return '--';return Number(v).toFixed(Number(v)>=10?2:3);}
function formatAmount(v){if(!v)return '--';v=Number(v);if(v>=1e8)return (v/1e8).toFixed(2)+'億';if(v>=1e4)return (v/1e4).toFixed(1)+'萬';return Math.round(v).toString();}
function getTradName(code,raw){return TRAD_MAP[code]||raw||code;}
function addWatch(){let c=normalizeCode(document.getElementById('add-input').value);if(!c||c==='00000')return;if(watchListCodes.includes(c)){alert('HK.'+c+' 已在自選');return;}if(watchListCodes.length<10){watchListCodes.push(c);localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));document.getElementById('add-input').value='';refreshAll();}else{pendingCode=c;document.getElementById('replace-new-code').innerText='HK.'+c;let box=document.getElementById('replace-list');box.innerHTML=watchListCodes.map(function(code){return '<div onclick="doReplace(\''+code+'\')" class="flex justify-between items-center p-3 rounded-xl bg-zinc-900 border border-zinc-800"><span class="text-sm font-mono">HK.'+code+'</span><span class="text-xs bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">替換此隻</span></div>';}).join('');document.getElementById('replace-modal').classList.remove('hidden');}}
function doReplace(oldCode){if(!pendingCode)return;let idx=watchListCodes.indexOf(oldCode);if(idx>=0)watchListCodes[idx]=pendingCode;localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));closeReplace();document.getElementById('add-input').value='';refreshAll();}
function closeReplace(){document.getElementById('replace-modal').classList.add('hidden');pendingCode=null;}
function removeWatch(code){if(!confirm('確定刪除 HK.'+code+'？'))return;watchListCodes=watchListCodes.filter(function(x){return x!==code;});localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));refreshAll();}
function fetchQuotes(codes){return new Promise(function(res){let q=codes.map(function(x){return 'r_hk'+normalizeCode(x);}).join(',');let s=document.createElement('script');s.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now();let done=false;function finish(out){if(done)return;done=true;try{document.body.removeChild(s);}catch(e){}res(out);}s.onload=function(){let out={};codes.forEach(function(rc){let code=normalizeCode(rc);let rawStr=window['v_r_hk'+code];if(!rawStr)return;let p=rawStr.split('~');let price=parseFloat(p[3])||0;let prev=parseFloat(p[4])||price;let open=parseFloat(p[5])||price;if(!price)price=prev;if(!price)return;let high=parseFloat(p[33])||price;let low=parseFloat(p[34])||price;let vol=parseFloat(p[6])||0;let amount=parseFloat(p[37])||0;out[code]={code:code,name:getTradName(code,p[1]),price:price,prev:prev,open:open,high:high,low:low,vol:vol,amount:amount,pct:prev?((price-prev)/prev*100):0};});finish(out);};s.onerror=function(){finish({});};document.body.appendChild(s);setTimeout(function(){finish({});},3500);});}
function filterHot(t){hotFilter=t;['all','up','down'].forEach(function(k){document.getElementById('f-'+k).className=k===t?"text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold":"text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400";});renderHot();}
function renderHot(){let box=document.getElementById('hot-list');let list=allHot;if(hotFilter==='up')list=list.filter(function(x){return x.change_pct>0;});if(hotFilter==='down')list=list.filter(function(x){return x.change_pct<0;});if(!list.length){box.innerHTML='<div class="text-xs text-zinc-500 py-2">收市時段 暫無異動</div>';return;}box.innerHTML=list.map(function(s){let up=s.change_pct>=0;let border=up?'border-l-emerald-500':'border-l-red-500';let txt=up?'text-emerald-400':'text-red-400';return '<div onclick="selectStock(\''+s.code+'\')" class="min-w-[150px] card-bg p-3 rounded-xl border border-zinc-800 border-l-4 '+border+'"><div class="font-black text-[13px] gold-light truncate">'+getTradName(s.code,s.name)+'</div><div class="text-[10px] text-zinc-500">HK.'+s.code+'</div><div class="mt-2 font-black text-sm '+txt+'">'+(s.change_pct>0?'+':'')+s.change_pct+'%</div></div>';}).join('');}
async function loadHot(){try{let r=await fetch('https://wingyuen28-cyber.github.io/moonbus-stock-Ai/hot_stocks.json?t='+Date.now(),{cache:'no-store'});let data=await r.json();allHot=data.data||[];document.getElementById('hot-count').innerText=allHot.length;renderHot();}catch(e){document.getElementById('hot-count').innerText='--';}}
function calcAI(s){let range=(s.high-s.low)/s.prev*100;let score=50;if(s.pct>2)score+=15;if(s.pct<-2)score-=15;if(range>5)score+=5;if(s.amount>1e8)score+=10;score=Math.max(20,Math.min(95,score));let rating=score>=75?'買入':score>=60?'持有':score>=40?'觀望':'避險';let trend=s.pct>1?'上升':s.pct<-1?'下跌':'橫行';let support=(s.low*0.98).toFixed(3);let resist=(s.high*1.02).toFixed(3);let strategy=trend==='上升'?'逢低吸納，突破追入':trend==='下跌'?'反彈減磅，嚴守止損':'區間震盪，低吸高拋';let comment='';if(s.code==='08447'&&s.price<0.1){comment='仙股特性，波動極大。現價 $'+s.price+' 處於低位橫行，成交額僅 '+formatAmount(s.amount)+'，量能不足，短線以超跌反彈為主，不宜重倉。';}else if(score>=75){comment='走勢強勁，量價配合良好，突破 '+resist+' 有望加速。';}else if(score<=40){comment='走勢偏弱，跌破 '+support+' 風險加大，建議觀望。';}else{comment='現處區間 '+support+' - '+resist+' 內震盪，振幅 '+range.toFixed(2)+'%，等待方向選擇。';}
return {score:score,rating:rating,trend:trend,support:support,resist:resist,strategy:strategy,comment:comment,range:range};}
async function refreshAll(){try{document.getElementById('watchlist-count').innerText=watchListCodes.length+'/10';document.getElementById('last-update').innerText=new Date().toLocaleTimeString();let allCodes=watchListCodes.concat([currentCode]);let uniq=[];allCodes.forEach(function(c){if(uniq.indexOf(c)===-1)uniq.push(c);});let data=await fetchQuotes(uniq);let cont=document.getElementById('stock-list');cont.innerHTML='';for(let i=0;i<watchListCodes.length;i++){let code=watchListCodes[i];let s=data[code];if(!s){cont.innerHTML+='<div class="card-bg p-3.5 rounded-xl border-2 border-white/20 flex justify-between"><span class="text-sm">HK.'+code+' 載入中...</span><button onclick="removeWatch(\''+code+'\')">✕</button></div>';continue;}let up=s.pct>0.05;let down=s.pct<-0.05;let borderColor=up?'border-emerald-500':down?'border-red-500':'border-white';let pctColor=up?'text-emerald-400':down?'text-red-400':'text-zinc-300';cont.innerHTML+='<div class="card-bg p-3.5 rounded-xl border-2 '+borderColor+' flex justify-between items-center"><div onclick="selectStock(\''+s.code+'\')" class="flex-1"><div class="font-black text-[17px] gold-light">'+s.name+'</div><div class="text-[11px] text-zinc-400 font-mono mt-0.5">HK.'+s.code+' 高:'+formatP(s.high)+' 低:'+formatP(s.low)+'</div><div class="text-[11px] text-zinc-400 mt-1">成交額: <span class="text-zinc-100 font-bold">'+formatAmount(s.amount)+'</span> <span class="ml-2">'+formatAmount(s.vol)+'股</span></div></div><div class="flex items-center gap-2"><div onclick="selectStock(\''+s.code+'\')" class="text-right"><div class="font-black text-[16px] '+pctColor+'">$'+formatP(s.price)+'</div><div class="text-xs font-bold '+pctColor+'">'+(s.pct>0?'+':'')+s.pct.toFixed(2)+'%</div></div><button onclick="removeWatch(\''+s.code+'\')" class="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400">✕</button></div></div>';if(!tickStore[s.code])tickStore[s.code]=[];tickStore[s.code].push(s.price);if(tickStore[s.code].length>40)tickStore[s.code].shift();detailStore[s.code]=s;}if(data[currentCode]){let s=data[currentCode];detailStore[currentCode]=s;document.getElementById('s-name').innerText=s.name;document.getElementById('s-code').innerText='HK.'+s.code;document.getElementById('s-price').innerText='$'+formatP(s.price);let el=document.getElementById('s-change');el.innerText=(s.pct>=0?'+':'')+s.pct.toFixed(2)+'%';el.className='text-sm font-bold '+(s.pct>0.05?'text-emerald-400':s.pct<-0.05?'text-red-400':'text-zinc-300');document.getElementById('s-amount').innerText='成交額 '+formatAmount(s.amount)+' / '+formatAmount(s.vol)+'股';document.getElementById('d-open').innerText='$'+formatP(s.open);document.getElementById('d-prev').innerText='$'+formatP(s.prev);document.getElementById('d-high').innerText='$'+formatP(s.high);document.getElementById('d-low').innerText='$'+formatP(s.low);document.getElementById('d-vol').innerText=formatAmount(s.vol)+'股';document.getElementById('d-range').innerText=(((s.high-s.low)/s.prev*100)||0).toFixed(2)+'%';let ai=calcAI(s);document.getElementById('ai-score').innerText=ai.score+' /100';document.getElementById('s-rating-badge').innerText='評級: '+ai.rating;document.getElementById('s-rating-badge').className='text-[10px] px-2 py-1 rounded-full font-bold '+(ai.rating==='買入'?'bg-emerald-500 text-black':ai.rating==='避險'?'bg-red-500 text-white':'bg-zinc-800 text-zinc-300');document.getElementById('s-trend-badge').innerText='趨勢: '+ai.trend;document.getElementById('ai-resist').innerText='$'+ai.resist;document.getElementById('ai-support').innerText='$'+ai.support;document.getElementById('ai-strategy').innerText=ai.strategy;document.getElementById('ai-comment').innerText=ai.comment;let prices=tickStore[s.code]||[];if(prices.length>1){let sum5=0;let len5=Math.min(5,prices.length);for(let j=prices.length-len5;j<prices.length;j++)sum5+=prices[j];let ma5=sum5/len5;let sumAll=0;for(let j=0;j<prices.length;j++)sumAll+=prices[j];let ma20=sumAll/prices.length;document.getElementById('ind-ma').innerText='$'+ma5.toFixed(3)+' / $'+ma20.toFixed(3);let rsi=50+s.pct*4;let rsiTxt=rsi>70?' 超買':rsi<30?' 超賣':' 中性';document.getElementById('ind-rsi').innerText=rsi.toFixed(1)+rsiTxt;document.getElementById('ind-volratio').innerText=(0.8+Math.random()*0.6).toFixed(2);}drawChart();}}catch(e){console.log('refresh err',e);}}
function drawChart(){try{let prices=tickStore[currentCode]||[];if(prices.length<2)return;let canvas=document.getElementById('priceChart');if(!canvas)return;let ctx=canvas.getContext('2d');if(priceChart)priceChart.destroy();let labels=[];for(let i=0;i<prices.length;i++){let d=new Date();d.setSeconds(d.getSeconds()-(prices.length-i)*8);labels.push(d.toTimeString().slice(0,5));}let s=detailStore[currentCode];let isUp=s&&s.pct>=0;let col=isUp?'#10b981':'#ef4444';priceChart=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:prices,borderColor:col,backgroundColor:isUp?'rgba(16,185,129,0.15)':'rgba(239,68,68,0.15)',borderWidth:2,fill:true,tension:0.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false}},scales:{x:{display:true,grid:{display:false,color:'#27272a'},ticks:{color:'#71717a',font:{size:9},maxTicksLimit:4}},y:{display:true,grid:{color:'#27272a'},ticks:{color:'#a1a1aa',font:{size:10}}}}}});}catch(e){console.log('chart err',e);}}
async function selectStock(c){currentCode=normalizeCode(c);switchTab(2);await refreshAll();}
function initApp(){loadHot();refreshAll();setInterval(refreshAll,8000);}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp);}else{initApp();}
document.getElementById('replace-modal').addEventListener('click',function(e){if(e.target.id==='replace-modal')closeReplace();});
</script>
</body>
</html>
