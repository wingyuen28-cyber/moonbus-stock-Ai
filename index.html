<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoonBus 股票精選 AI</title>
<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json?v=53">
<meta name="theme-color" content="#FACC15">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0D1117;color:#E6EDF3}.card-bg{background:#161B22}.gold{color:#FACC15}.gold-light{color:#FDE68A}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}#splash{position:fixed;inset:0;background:#0D1117;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}</style>
</head>
<body class="pb-28">
<div id="splash"><img src="icon-512.png" style="width:88px;height:88px;border-radius:16px"><div style="color:#facc15;font-weight:900;margin-top:12px">MOONBUS V5.3 PRO</div><div style="color:#666;font-size:10px;margin-top:6px">買賣盤深度載入中...</div></div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';s.style.transition='0.4s';setTimeout(function(){s.style.display='none';},350);}},1300);if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}</script>
<header class="sticky top-0 z-40 bg-[#0D1117]/95 backdrop-blur px-4 py-3 border-b border-zinc-800"><div class="flex justify-between items-center max-w-md mx-auto"><h1 class="font-black flex items-center gap-2 text-[13px]"><img src="icon-512.png" class="w-7 h-7 rounded-lg"><span class="gold">MOONBUS 股票精選 AI</span><span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-black">V5.3</span></h1><div class="text-[10px] text-emerald-400">● 即時</div></div></header>

<main class="max-w-md mx-auto px-4 mt-3 space-y-4">
<section id="tab1-wrap" class="space-y-3">
<div class="flex justify-between items-center"><span class="text-[15px] font-black gold">⭐ 自選監測 <span id="watchlist-count" class="text-indigo-300 font-mono ml-1">--</span></span><span class="flex gap-2 items-center"><span id="last-update" class="text-[10px] text-zinc-500">--:--:--</span><button onclick="localStorage.setItem('mb_watch_v33',JSON.stringify(DEFAULT_WATCH));location.reload();" class="text-[10px] bg-yellow-400 text-black px-2.5 py-1 rounded-full font-black">重設8隻</button></span></div>
<div class="card-bg p-2.5 rounded-xl flex gap-2 border border-zinc-800"><input id="add-input" inputmode="numeric" placeholder="輸入代號 如 02342" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none"><button onclick="addWatch()" class="bg-[#FACC15] text-black font-black px-5 rounded-lg text-sm">加入</button></div>
<div id="stock-list" class="space-y-3 text-xs text-zinc-500">載入中...</div>
<div class="space-y-2 pt-1"><div class="flex justify-between items-center"><span class="text-[14px] font-black gold">📊 異動掃描 <span id="hot-count" class="text-yellow-400 font-mono ml-1">--</span></span><div class="flex gap-1"><button onclick="filterHot('all')" id="f-all" class="text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold">全部</button><button onclick="filterHot('up')" id="f-up" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急升</button><button onclick="filterHot('down')" id="f-down" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急跌</button></div></div><div id="hot-list" class="flex gap-2 overflow-x-auto no-scrollbar pb-2"></div></div>
</section>

<section id="tab2-content" class="hidden space-y-3">
<div class="card-bg p-4 rounded-xl border border-zinc-800">
<div class="flex justify-between items-start"><div><h2 id="s-name" class="font-black text-[18px] gold-light">--</h2><div id="s-code" class="text-xs text-zinc-500 font-mono">HK.-----</div><div class="flex gap-2 mt-2"><span id="s-rating-badge" class="text-[10px] px-2 py-1 rounded-full bg-zinc-800">--</span><span id="s-trend-badge" class="text-[10px] px-2 py-1 rounded-full bg-zinc-800">--</span></div></div><div class="text-right"><div id="s-price" class="text-[26px] font-black">$--</div><div id="s-change" class="text-sm font-bold">--</div><div id="s-amount" class="text-[10px] text-zinc-400 mt-1">--</div></div></div>
<div class="h-[190px] mt-4 w-full"><canvas id="priceChart"></canvas></div>
<div class="grid grid-cols-3 gap-2 mt-4 text-[11px]"><div class="bg-zinc-900 rounded-lg p-2 border border-zinc-800"><div class="text-zinc-500">今開</div><div id="d-open" class="font-bold">--</div></div><div class="bg-zinc-900 rounded-lg p-2
