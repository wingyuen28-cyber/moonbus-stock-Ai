<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoonBus Stock Select AI</title>
<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json?v=43">
<meta name="theme-color" content="#facc15">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0D1117;color:#E6EDF3;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.card-bg{background:#161B22}
.gold{color:#FACC15}
.gold-light{color:#FDE68A}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
#splash{position:fixed;inset:0;background:#0D1117;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>
<body class="pb-20">
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
setTimeout(()=>{var s=document.getElementById('splash');if(s)s.style.display='none';},700);
</script>
<div id="splash"><img src="icon-512.png" style="width:88px;height:88px;border-radius:16px"><div style="color:#facc15;font-weight:900;margin-top:12px;letter-spacing:.15em">MOONBUS V4.3 GOLD</div></div>

<header class="sticky top-0 z-40 bg-[#0D1117]/95 backdrop-blur px-4 py-3 border-b border-zinc-800">
<div class="flex justify-between items-center max-w-md mx-auto">
<h1 class="font-black flex items-center gap-2 text-[13px]"><img src="icon-512.png" class="w-7 h-7 rounded-lg"> <span class="gold">MOONBUS 股票精選 AI</span> <span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-black">V4.3</span></h1>
<div class="text-[10px] text-emerald-400">● 即時</div>
</div>
</header>

<main class="max-w-md mx-auto px-4 mt-3 space-y-4">
<section class="space-y-2">
<div class="flex justify-between items-center">
<span class="text-[15px] font-black gold">⭐ 自選監測 <span id="watchlist-count" class="text-indigo-300 font-mono ml-1">0/10</span></span>
<span class="flex gap-2 items-center"><span id="last-update" class="text-[10px] text-zinc-500 font-mono">--:--:--</span><button onclick="resetWatch()" class="text-[10px] underline text-zinc-500">重設</button></span>
</div>
<div class="card-bg p-2.5 rounded-xl flex gap-2 border border-zinc-800">
<input id="add-input" inputmode="numeric" placeholder="輸入代號 如 00700" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none">
<button onclick="addWatch()" class="bg-[#FACC15] text-black font-black px-5 rounded-lg text-sm">加入</button>
</div>
<div id="stock-list" class="space-y-3"></div>
</section>

<section class="space-y-2">
<div class="flex justify-between items-center">
<span class="text-[14px] font-black gold">📊 異動掃描 <span id="hot-count" class="text-yellow-400 font-mono ml-1">--</span></span>
<div class="flex gap-1"><button onclick="filterHot('all')" id="f-all" class="text-[10px] px-2.5 py-1 rounded-full bg-white text-black font-bold">全部</button><button onclick="filterHot('up')" id="f-up" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急升</button><button onclick="filterHot('down')" id="f-down" class="text-[10px] px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">急跌</button></div>
</div>
<div id="hot-list" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 text-xs"></div>
</section>

<div class="flex bg-zinc-900 p-1 border border-zinc-800 rounded-lg"><button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2 text-sm rounded-md bg-white text-black font-bold">自選</button><button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2 text-sm rounded-md text-zinc-400">深度分析</button></div>
<section id="tab2-content" class="hidden"><div class="card-bg p-4 rounded-xl border border-zinc-800"><div class="flex justify-between"><div><h2 id="s-name" class="font-black text-base gold">---</h2><div id="s-code" class="text-xs text-zinc-500">HK.-----</div></div><div class="text-right"><div id="s-price" class="text-2xl font-black">$0.000</div><div id="s-change" class="text-xs font-bold">0.00%</div><div id="s-amount" class="text-[10px] text-zinc-400 mt-1">成交額 --</div></div></div><div class="h-36 mt-3"><canvas id="priceChart"></canvas></div></div></section>
</main>

<div id="replace-modal" class="fixed inset-0 bg-black/75 z-[100] hidden flex items-end justify-center"><div class="bg-[#161B22] w-full max-w-md rounded-t-2xl p-4 border-t border-zinc-700"><div class="w-10 h-1 bg-zinc-700 rounded-full mx-auto mb-3"></div><div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm gold">自選已滿 10/10</h3><button onclick="closeReplace()" class="w-7 h-7 rounded-full bg-zinc-800">✕</button></div><div class="text-xs text-zinc-400 mb-2">新股 <span id="replace-new-code" class="text-yellow-400 font-bold"></span> 要替換邊一隻？</div><div id="replace-list" class="space-y-2 max-h-72 overflow-auto"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const DEFAULT_WATCH=["00700","09988","03690","08447","02342","00981","02800","01211"];
let w=localStorage.getItem('mb_watch_v33');let watchListCodes=w?JSON.parse(w):DEFAULT_WATCH;if(!watchListCodes||watchListCodes.length===0){watchListCodes=DEFAULT_WATCH;localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));}
let currentCode='00700',priceChart=null,tickStore={},pendingCode=null,allHot=[],hotFilter='all';
function resetWatch(){localStorage.setItem('mb_watch_v33',JSON.stringify(DEFAULT_WATCH));location.reload();}
function switchTab(n){document.getElementById('tab1-btn').className=n===1?"flex-1 py-2 text-sm rounded-md bg-white text-black font-bold":"flex-1 py-2 text-sm rounded-md text-zinc-400";document.getElementById('tab2-btn').className=n===2?"flex-1 py-2 text-sm rounded-md bg-white text-black font-bold":"flex-1 py-2 text-sm rounded-md text-zinc-400";document.getElementById('tab2-content').classList.toggle('hidden',n!==2);}
function normalizeCode(c){return String(c).replace(/\D/g,'').padStart(5,'0');}
function formatP(v){return isNaN(v)?'--':Number(v).toFixed(3);}
function formatAmount(v){if(!v||v==0)return '--';if(v>=1e8)return (v/1e8).toFixed(2)+'億';if(v>=1e4)return (v/1e4).toFixed(1)+'萬';return v.toString();}
function addWatch(){let c=normalizeCode(document.getElementById('add-input').value);if(!c||c==='00000')return;if(watchListCodes.includes(c)){alert('HK.'+c+' 已在自選');return;}if(watchListCodes.length<10){watchListCodes.push(c);localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));document.getElementById('add-input').value='';refreshAll();}else{pendingCode=c;document.getElementById('replace-new-code').innerText='HK.'+c;let box=document.getElementById('replace-list');box.innerHTML=watchListCodes.map(code=>`<div onclick="doReplace('${code}')" class="flex justify-between items-center p-3 rounded-xl bg-zinc-900 border border-zinc-800"><span class="text-sm font-mono">HK.${code}</span><span class="text-xs bg-yellow-400 text-black px-3 py-1 rounded-full font-bold">替換此隻</span></div>`).join('');document.getElementById('replace-modal').classList.remove('hidden');}}
function doReplace(oldCode){if(!pendingCode)return;let idx=watchListCodes.indexOf(oldCode);if(idx>=0)watchListCodes[idx]=pendingCode;localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));closeReplace();document.getElementById('add-input').value='';refreshAll();}
function closeReplace(){document.getElementById('replace-modal').classList.add('hidden');pendingCode=null;}
function removeWatch(code){if(!confirm('確定刪除 HK.'+code+'？'))return;watchListCodes=watchListCodes.filter(x=>x!==code);localStorage.setItem('mb_watch_v33',JSON.stringify(watchListCodes));refreshAll();}
function fetchQuotes(codes){return new Promise(res=>{let q=codes.map(x=>'r_hk'+normalizeCode(x)).join(',');let s=document.createElement('script');s.src='https://qt.gtimg.cn/q='+q+'
