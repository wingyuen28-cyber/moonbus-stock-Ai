<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港股 AI 異動大師 V2.1</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{background:#0D1117;color:#E6EDF3}.hk-up{color:#30D158}.hk-down{color:#FF3B30}.card-bg{background:#161B22;border:1px solid #30363D}.hot-gem{border-color:#A855F7!important;box-shadow:0 0 15px rgba(168,85,247,.35)}.hot-main{border-color:#FACC15!important;box-shadow:0 0 15px rgba(250,204,21,.35)}</style>
</head>
<body class="pb-10">
<header class="sticky top-0 z-50 card-bg px-4 py-3"><div class="flex justify-between items-center max-w-md mx-auto"><h1 class="font-bold text-white">港股 AI 異動大師 <span class="text-xs px-2 py-0.5 rounded bg-yellow-900 text-yellow-300">V2.1 修復</span></h1><div class="text-xs text-gray-400"><span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 inline-block"></span> <span id="db-status-badge">連線中</span></div></div><div class="flex justify-between max-w-md mx-auto mt-2 pt-2 border-t border-gray-800 text-xs"><div>自訂:<span id="watchlist-count" class="text-indigo-400 font-bold">0/10</span></div><div>異動榜:<span id="hot-count-top" class="text-yellow-400 font-bold">--隻</span></div><div>更新:<span id="last-update-time">--:--</span></div></div></header>
<main class="max-w-md mx-auto px-4 mt-4 space-y-4">
<section class="card-bg p-3 rounded-xl space-y-2 border border-yellow-900/50"><div class="flex justify-between"><span class="text-yellow-400 font-black text-sm">💎 全場異動榜</span><span class="text-[10px]"> <span id="hot-update-time">--:--</span> <button onclick="loadHotStocks()" class="text-yellow-400 underline ml-2">刷新榜單</button></span></div><div id="hot-list" class="space-y-2 text-xs text-gray-500 text-center py-3">讀取中...</div></section>
<div class="flex rounded-lg bg-gray-900 p-1 border border-gray-800"><button id="tab1-btn" onclick="switchTab(1)" class="flex-1 py-2 text-sm rounded-md bg-indigo-600 text-white">階段一：自訂監測網</button><button id="tab2-btn" onclick="switchTab(2)" class="flex-1 py-2 text-sm rounded-md text-gray-400">階段二：個股深度分析</button></div>
<section id="tab1-content" class="space-y-3"><div class="card-bg p-3 rounded-xl"><div class="flex space-x-2 mt-1"><input id="add-watchlist-input" placeholder="如 2342,8000" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm"><button onclick="handleAddWatchlist()" class="bg-indigo-600 px-4 rounded-lg text-sm">加入</button></div></div><div id="stock-list" class="space-y-3"></div></section>
<section id="tab2-content" class="space-y-4 hidden"><div class="card-bg p-3 rounded-xl flex space-x-2"><input id="search-input" value="00700" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm"><button onclick="handleSearch()" class="bg-indigo-600 px-4 rounded-lg text-sm">分析</button></div><div id="quote-header" class="card-bg p-4 rounded-xl"><div class="flex justify-between"><div><h2 id="stock-name" class="font-bold">---</h2><div id="stock-code" class="text-xs text-gray-400">HK.-----</div><span id="stock-category-badge" class="text-[10px] px-2 py-0.5 rounded bg-indigo-900/60 text-indigo-300">---</span></div><div class="text-right"><div id="stock-price" class="text-2xl font-black">$0.000</div><div id="stock-change" class="text-xs">0.00%</div></div></div><div class="grid grid-cols-4 gap-2 pt-2 mt-2 border-t border-gray-800 text-center text-xs"><div>昨收<br><span id="prev-close">--</span></div><div>今開<br><span id="open-price">--</span></div><div>最高<br><span id="high-price">--</span></div><div>最低<br><span id="low-price">--</span></div></div></div><div class="card-bg p-4 rounded-xl space-y-2"><div class="flex justify-between border-b border-gray-800 pb-2"><span class="font-bold text-sm">AI 主力評級</span><span id="ai-status-badge" class="px-2 py-1 rounded text-xs border">計算中</span></div><div id="ai-rating-desc" class="text-xs bg-gray-900/60 p-2 rounded">分析中...</div><div class="flex justify-between text-xs"><span>買盤 <span id="buy-pct">0%</span></span><span>量比 <span id="vol-ratio-disp">1.0x</span></span><span>沽盤 <span id="sell-pct">0%</span></span></div><div class="w-full bg-gray-800 h-3 rounded-full flex overflow-hidden"><div id="buy-bar" class="bg-green-500 h-full" style="width:50%"></div><div id="sell-bar" class="bg-red-500 h-full" style="width:50%"></div></div><div class="h-32"><canvas id="priceChart"></canvas></div><div class="h-32"><canvas id="vwapChart"></canvas></div></div><div class="card-bg p-4 rounded-xl"><div id="ai-score" class="text-xl font-black text-indigo-400">--分</div><div id="risk-reward-advice" class="text-xs mt-1">計算中...</div></div></section>
</main>
<script>
let fullStockDatabase={}, priceChartInstance=null, vwapChartInstance=null, currentSelectedCode='00700', stockAccumulatedStore={}, DEFAULT_WATCHLIST=['00700','09988','03690','01810','02800','01211','00981','01024','02342','08447'], watchListCodes=(()=>{
  try{ const s=localStorage.getItem('hk_user_watchlist_v1'); if(s){ const l=JSON.parse(s); if(l&&l.length>0) return l; } }catch(e){} return DEFAULT_WATCHLIST;
})();
function normalizeCode(c){ return String(c||'').replace(/\D/g,'').padStart(5,'0'); }
function formatPriceNum(v){ return isNaN(v)?'0.000':Number(v).toFixed(3); }
function formatAmount(v){ v=parseFloat(v); if(isNaN(v)) return '--'; if(v>=1e8) return (v/1e8).toFixed(2)+'億'; if(v>=1e4) return (v/1e4).toFixed(0)+'萬'; return v.toFixed(0); }
function switchTab(n){ document.getElementById('tab1-content').classList.toggle('hidden', n!==1); document.getElementById('tab2-content').classList.toggle('hidden', n!==2); document.getElementById('tab1-btn').className=n===1?"flex-1 py-2 text-sm rounded-md bg-indigo-600 text-white":"flex-1 py-2 text-sm rounded-md text-gray-400"; document.getElementById('tab2-btn').className=n===2?"flex-1 py-2 text-sm rounded-md bg-indigo-600 text-white":"flex-1 py-2 text-sm rounded-md text-gray-400"; }
window.onload=async()=>{ await loadStockDatabase(); await loadHotStocks(); refreshRealtimeData(); setInterval(refreshRealtimeData,8000); };
async function loadStockDatabase(){ try{ const r=await fetch('stocks.json?_t='+Date.now()); if(r.ok) fullStockDatabase=await r.json(); }catch(e){} }
async function loadHotStocks(){ try{ const r=await fetch('hot_stocks.json?_t='+Date.now()); const box=document.getElementById('hot-list'); if(!r.ok){ box.innerHTML='<div class="py-3">暫無 hot_stocks.json，請先跑一次 generate_stocks.py V2，之後會自動顯示黃框異動榜</div>'; document.getElementById('hot-count-top').innerText='0隻'; return; } const j=await r.json(); const list=j.data||[]; document.getElementById('hot-count-top').innerText=list.length+'隻'; document.getElementById('hot-update-time').innerText=j.update_time||''; if(list.length===0){ box.innerHTML='<div class="py-3">今日暫無異動，市場平靜中</div>'; return; } box.innerHTML=''; list.forEach(s=>{ const isUp=s.change_pct>=0; const bc=s.is_gem?'hot-gem':'hot-main'; const badge=s.is_gem?'<span class="text-[10px] px-1.5 py-0.5 rounded bg-purple-900 text-purple-300">創業板</span>':'<span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-900 text-yellow-300">💎金檔</span>'; box.innerHTML+=`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded-xl border-2 ${bc} cursor-pointer text-left"><div class="flex justify-between"><span class="font-bold text-white">${s.name} <span class="text-gray-400 text-xs">HK.${s.code}</span> ${badge}</span><span class="${isUp?'text-green-400':'text-red-400'} font-black">${isUp?'▲+':'▼'}${s.change_pct}%</span></div><div class="text-[11px] text-gray-300 mt-1">${s.reason} | 量比 ${s.vol_ratio}x</div></div>`; }); }catch(e){ document.getElementById('hot-list').innerHTML='讀取失敗'; } }
function updateWatchlistCounter(){ document.getElementById('watchlist-count').innerText=watchListCodes.length+'/10'; }
function handleAddWatchlist(){ const c=normalizeCode(document.getElementById('add-watchlist-input').value); if(!c) return alert('請輸入代號'); if(watchListCodes.includes(c)) return alert('已存在'); if(watchListCodes.length>=10) return alert('最多10隻'); watchListCodes.push(c); localStorage.setItem('hk_user_watchlist_v1', JSON.stringify(watchListCodes)); document.getElementById('add-watchlist-input').value=''; refreshRealtimeData(); }
function handleRemoveWatchlist(e,code){ e.stopPropagation(); watchListCodes=watchListCodes.filter(x=>x!==code); localStorage.setItem('hk_user_watchlist_v1', JSON.stringify(watchListCodes)); refreshRealtimeData(); }
function fetchRealtimeQuoteScript(arr){ return new Promise(res=>{ const id='rt-loader'; const old=document.getElementById(id); if(old) old.remove(); const q=arr.map(c=>'r_hk'+normalizeCode(c)).join(','); const sc=document.createElement('script'); sc.id=id; sc.src='https://qt.gtimg.cn/q='+q+'&_t='+Date.now(); sc.onload=()=>{ const out={}; arr.forEach(rc=>{ const code=normalizeCode(rc); const raw=window['v_r_hk'+code]; if(!raw) return; const p=raw.split('~'); const price=parseFloat(p[3])||0, prev=parseFloat(p[4])||0, open=parseFloat(p[5])||0, high=parseFloat(p[33])||price, low=parseFloat(p[34])||price, turnover=parseFloat(p[37])*10000||0; const change=price-prev, pct=prev?(change/prev*100):0; let outer=parseFloat(p[7])||0, inner=parseFloat(p[8])||0, tot=outer+inner, buy=50; if(tot>0) buy=Math.round(outer/tot*100); const vol=parseFloat(p[49])||parseFloat(p[47])||1.2; out[code]={code,name:p[1]||(fullStockDatabase[code]?fullStockDatabase[code].name:code),price,prevClose:prev,open,high,low,change,pct,turnover,buyPct:buy,sellPct:100-buy,volumeRatio:vol,vwap:price}; }); res(out); }; sc.onerror=()=>res(null); document.body.appendChild(sc); }); }
async function refreshRealtimeData(){ updateWatchlistCounter(); const list=[...new Set([...watchListCodes, currentSelectedCode])]; const data=await fetchRealtimeQuoteScript(list); const badge=document.getElementById('db-status-badge'); if(!data){ badge.innerText='重試中'; return; } badge.innerText='實時連線中'; document.getElementById('last-update-time').innerText=new Date().toTimeString().split(' ')[0]; Object.values(data).forEach(s=>{ appendTick(s); }); const cont=document.getElementById('stock-list'); cont.innerHTML=''; watchListCodes.forEach(code=>{ const s=data[code]; if(!s) return; const up=s.change>=0; cont.innerHTML+=`<div onclick="selectStock('${s.code}')" class="card-bg p-3 rounded-xl cursor-pointer"><div class="flex justify-between"><span class="font-bold text-white">${s.name} <span class="text-xs text-gray-400">HK.${s.code}</span></span><span class="text-xs px-2 py-0.5 rounded border ${up?'bg-green-900/50 text-green-300':'bg-red-900/50 text-red-300'}">${up?'▲':''}${s.pct.toFixed(2)}%</span></div><div class="flex justify-between text-xs mt-2"><span>$${formatPriceNum(s.price)}</span><span class="text-gray-400">量比 ${s.volumeRatio.toFixed(1)}x</span><span>成交額 ${formatAmount(s.turnover)}</span></div></div>`; }); if(data[currentSelectedCode]) updateDetailCard(data[currentSelectedCode]); }
function appendTick(stock){ if(!stockAccumulatedStore[stock.code]) stockAccumulatedStore[stock.code]=[]; const a=stockAccumulatedStore[stock.code]; a.push({t:Date.now(),price:stock.price,vwap:stock.price}); if(a.length>25) a.shift(); }
function updateDetailCard(s){ document.getElementById('stock-name').innerText=s.name; document.getElementById('stock-code').innerText='HK.'+s.code; document.getElementById('stock-category-badge').innerText=fullStockDatabase[s.code]?fullStockDatabase[s.code].category:'港股'; document.getElementById('stock-price').innerText='$'+formatPriceNum(s.price); document.getElementById('stock-change').innerText=s.pct.toFixed(2)+'%'; document.getElementById('prev-close').innerText=formatPriceNum(s.prevClose); document.getElementById('open-price').innerText=formatPriceNum(s.open); document.getElementById('high-price').innerText=formatPriceNum(s.high); document.getElementById('low-price').innerText=formatPriceNum(s.low); document.getElementById('buy-pct').innerText=s.buyPct+'%'; document.getElementById('sell-pct').innerText=s.sellPct+'%'; document.getElementById('vol-ratio-disp').innerText=s.volumeRatio.toFixed(1)+'x'; document.getElementById('buy-bar').style.width=s.buyPct+'%'; document.getElementById('sell-bar').style.width=s.sellPct+'%'; document.getElementById('ai-status-badge').innerText=s.buyPct>=60?'🔥 主力買盤':s.buyPct<=40?'🔴 主力沽盤':'⚖️ 博弈'; renderCharts(stockAccumulatedStore[s.code]||[]); }
function renderCharts(h){ if(!h.length) return; const labels=h.map((_,i)=>i); const prices=h.map(o=>o.price); const ctx=document.getElementById('priceChart').getContext('2d'); if(priceChartInstance) priceChartInstance.destroy(); priceChartInstance=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:prices,borderColor:'#fff',backgroundColor:'rgba(255,255,255,0.06)',tension:0.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:'#666',font:{size:9}}}}}}}); const ctx2=document.getElementById('vwapChart').getContext('2d'); if(vwapChartInstance) vwapChartInstance.destroy(); vwapChartInstance=new Chart(ctx2,{type:'line',data:{labels,datasets:[{data:prices,borderColor:'#F59E0B',borderDash:[3,3],tension:0.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{ticks:{color:'#666'}}}}}); }
async function selectStock(c){ currentSelectedCode=normalizeCode(c); const q=await fetchRealtimeQuoteScript([currentSelectedCode]); if(q&&q[currentSelectedCode]){ updateDetailCard(q[currentSelectedCode]); switchTab(2); } }
function handleSearch(){ const v=document.getElementById('search-input').value; if(v) selectStock(v); }
</script>
</body>
</html>
