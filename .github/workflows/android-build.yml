      - name: 複製 index.html 至 www 目錄
        run: |
          cp index.html www/

      - name: 安裝依賴套件
        run: npm install

      - name: 建立並同步 Android 專案
        run: |
          rm -rf android
          npx --yes cap add android
          npx --yes cap sync android

      - name: 編譯 Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳 APK 至 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: hk-stock-ai-app-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
