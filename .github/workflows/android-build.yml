name: 自動打包 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 設定 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安裝套件並同步 Android 專案
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: 編譯 Android APK (Debug 可直接安裝版)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳 APK 至 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: hk-stock-ai-app-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
