name: 自動打包 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 建立 www 目錄並從港交所抓取最新股票名單
        run: |
          mkdir -p www
          python -m pip install --upgrade pip
          pip install pandas requests xlrd openpyxl
          python generate_stocks.py

      - name: 複製 index.html 至 www 目錄
        run: |
          cp index.html www/

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 設定 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安裝依賴套件
        run: npm install

      - name: 建立並同步 Android 專案
        run: |
          rm -rf android
          npx --yes cap add android
          npx --yes cap sync android

      - name: 編譯 Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上傳 APK 至 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: hk-stock-ai-app-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
