name: 更新港股異動榜 (含創業板)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,4,7 * * 1-5'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - run: pip install requests
      - run: python generate_stocks.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "update" && git push)