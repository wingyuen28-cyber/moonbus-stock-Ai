name: 更新港股異動榜 (含創業板)

on:
  workflow_dispatch: # 保留手動觸發按鈕
  schedule:
    # 1. 早市啟動：09:30, 09:40, 09:50 HKT (01:30, 01:40, 01:50 UTC)
    - cron: '30,40,50 1 * * 1-5'
    
    # 2. 盤中常規：10:00 - 15:50 HKT 每 10 分鐘一次 (02:00 - 07:50 UTC)
    - cron: '*/10 2-7 * * 1-5'
    
    # 3. 收市結算：16:00 HKT (08:00 UTC)
    - cron: '0 8 * * 1-5'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python generate_stocks.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto update 3D stocks" && git push)
